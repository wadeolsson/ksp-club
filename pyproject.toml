[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ksp-club"
version = "0.1.0"
description = "KSP CLUB — Dual-State Merge System for asynchronous multiplayer KSP"
requires-python = ">=3.9"

[project.scripts]
ksp-club = "merger.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["merger*"]
